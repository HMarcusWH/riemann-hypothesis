# Registration only. GitHub evaluates the workflow version at the selected ref.
# Never run research or interpret a default-branch dispatch as qualification.
name: OPICA exact Step 4 kernel-object proof and claim verification
on:
  workflow_dispatch:
    inputs:
      execution_profile:
        description: Select original hosted or dedicated long-run execution (same proof gates)
        required: true
        type: choice
        options: [HOSTED_ORIGINAL, LONGRUN_ORIGINAL]
        default: HOSTED_ORIGINAL
      reviewed_head:
        description: Exact reviewed 40-hex proof branch commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse execution of the registration-only workflow
        shell: bash
        run: |
          echo 'REGISTRATION_ONLY; NO_PROOF_ACCEPTANCE'
          echo 'Select the separately reviewed branch: research/opica-step4-combined-gate-20261121'
          echo 'RH OPEN; C1 OPEN; Step4 OPEN'
          exit 2
