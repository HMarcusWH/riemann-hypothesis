name: OPICA governed native typed search
run-name: OPICA typed native research at ${{ github.sha }}
on:
  push:
    branches: [research/opica-governed-native-search-20261122]
    paths:
      - .github/workflows/opica-governed-native-search.yml
      - research/opica_governed/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opica-governed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  typed-proposer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/zeta-23-lean
          ref: bb7c8184a135b2823c6296917c5ac893bebf2a71
          path: native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/RHRC/integration/opica_composition/
            research/RHRC/integration/opica_round4/math_gate.py
            research/RHRC/routes/R003_ccm_bridge/post290/lean_expr_dag.py
            Zeta23/OPICARound4/IntegrationTargets.lean
            Zeta23/OPICARound4/SearchSupport.lean
            Zeta23/OPICARound4/ClosureConsumers.lean
            Zeta23/OPICARound4/NativeSourceBudget.lean
            Zeta23/OPICARound4/NativeJointIndex.lean
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - name: Test governed source, authority and anti-RH controls
        run: |
          set -euo pipefail
          python -m unittest discover -s controller/research/opica_governed -p test_reviewed_plan.py -v
          python -O -m unittest discover -s controller/research/opica_governed -p test_reviewed_plan.py -v
      - name: Run ORIGINAL OPICA typed-DAG search engine regression
        working-directory: native
        run: |
          set -euo pipefail
          python -B -m unittest -v research.RHRC.integration.opica_composition.tests.test_composition_search
      - name: Search three actual native OPICA typed target contracts
        run: |
          set -euo pipefail
          python -B controller/research/opica_governed/run_frozen_native_retrieval.py \
            --fork "$GITHUB_WORKSPACE/controller" --native "$GITHUB_WORKSPACE/native" \
            --output "$RUNNER_TEMP/OPICA_NATIVE_TYPED_PREVIEW.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-native-typed-preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPICA_NATIVE_TYPED_PREVIEW.json
          if-no-files-found: warn
          retention-days: 90
  native-verified-search:
    needs: typed-proposer
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/zeta-23-lean
          ref: bb7c8184a135b2823c6296917c5ac893bebf2a71
          path: host
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - name: Require two exact, separate compiler worlds
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD:src)" = "69b331ce0e429c7632dac6aa642e5875a50b1218"
          test "$(cat controller/lean-toolchain)" = "leanprover/lean4:v4.36.0"
          test "$(git -C host rev-parse HEAD)" = "bb7c8184a135b2823c6296917c5ac893bebf2a71"
          test "$(git -C host rev-parse HEAD^{tree})" = "2b19357e1b65cc500f3e3a5b5d4df14601b02062"
          test "$(cat host/lean-toolchain)" = "leanprover/lean4:v4.33.0-rc2"
      - uses: ./host/.github/actions/opica4-runtime
        with:
          native: 'true'
          provider: 'false'
      - name: Execute actual three-target native OPICA proof and independent replay
        working-directory: host
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect \
            --unit="opica-native-three-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" "PYTHONUTF8=1" "PYTHONDONTWRITEBYTECODE=1" \
            "LEAN_NUM_THREADS=2" "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" \
            "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python -B -m unittest -v \
            research.RHRC.integration.opica_composition.tests.test_integration_search_native
      - name: Execute independent C1 target with NO RH proof constants
        working-directory: host
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect \
            --unit="opica-c1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" "PYTHONUTF8=1" "PYTHONDONTWRITEBYTECODE=1" \
            "LEAN_NUM_THREADS=2" "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" \
            "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python -B "$GITHUB_WORKSPACE/controller/research/opica_governed/run_native_c1_search.py" \
              --controller "$GITHUB_WORKSPACE/controller" --native "$GITHUB_WORKSPACE/host" \
              --output "$RUNNER_TEMP/OPICA_NATIVE_C1_SEARCH.json"
      - name: Preserve nonaccepting research and kernel replay receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opica-native-c1-research-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/OPICA_NATIVE_C1_SEARCH.json
            ${{ runner.temp }}/opica4-source-before.json
            ${{ runner.temp }}/opica4-native/bootstrap/worker.json
            ${{ runner.temp }}/opica4-native/bootstrap/result.json
          if-no-files-found: warn
          retention-days: 90
