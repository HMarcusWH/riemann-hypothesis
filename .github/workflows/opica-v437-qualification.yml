name: OPICA v4.37 supplier and combined proof candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_head:
        description: Exact reviewed 40-hex qualification branch head
        required: true
        type: string
      include_native_candidate:
        description: Also attempt the same-pin native 50-root bridge
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: opica-v437-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'HMarcusWH/riemann-hypothesis' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/opica-community-v437-qualification-20261124') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/opica-community-v437-qualification-20261124' && inputs.verify_head == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /verification/opica-v437/
            /export-targets.txt
            /comparator/
            /comparator.json
            /lean-toolchain
            /lake-manifest.json
          sparse-checkout-cone-mode: false
      - name: Authenticate additive source and regression controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 668e62327f5e2b65b20a8d7a98dcd901e29f6cd8
          python3 -B verification/opica-v437/source.py "$EXPECTED_HEAD"
          python3 -B -O verification/opica-v437/source.py "$EXPECTED_HEAD"
          (cd verification/opica-v437 && python3 -B -m unittest -v test_source)
          (cd verification/opica-v437 && python3 -B -O -m unittest -v test_source)
  full:
    needs: source
    if: github.event_name == 'workflow_dispatch' && github.repository == 'HMarcusWH/riemann-hypothesis' && github.ref == 'refs/heads/research/opica-community-v437-qualification-20261124' && inputs.verify_head == github.sha
    runs-on: [self-hosted, Linux, X64, opica-v437]
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.verify_head }}
          persist-credentials: false
          fetch-depth: 1
      - name: Full supplier and optional combined native proof, isolated disposable runner only
        env:
          REVIEWED_HEAD: ${{ inputs.verify_head }}
          INCLUDE_NATIVE: ${{ inputs.include_native_candidate }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 668e62327f5e2b65b20a8d7a98dcd901e29f6cd8
          python3 -B verification/opica-v437/verify.py --head "$REVIEWED_HEAD" --include-native "$INCLUDE_NATIVE" --output "$RUNNER_TEMP/opica-v437-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve small receipts and logs; large exports remain in operator-owned runner storage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opica-v437-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opica-v437-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 90
