# Registration only. GitHub evaluates the workflow version at the selected ref.
# Never run research or interpret a default-branch dispatch as qualification.
name: OPICA Lean4.36 community supplier typed ingress
on:
  workflow_dispatch:
    inputs:
      verify_head:
        description: Exact 40-hex reviewed supplier source revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse execution of the registration-only workflow
        shell: bash
        run: |
          echo 'REGISTRATION_ONLY; NO_PROOF_ACCEPTANCE'
          echo 'Select the separately reviewed branch: research/opica-community-v436-supplier-qualification-20261123'
          echo 'RH OPEN; C1 OPEN; Step4 OPEN'
          exit 2
