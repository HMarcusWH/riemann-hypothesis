name: OPICA Lean4.36 community supplier typed ingress
on:
  push:
    branches: [research/opica-community-v436-supplier-qualification-20261123]
    paths:
      - .github/workflows/opica-v436-supplier.yml
      - verification/opica-v436/**
  workflow_dispatch:
    inputs:
      verify_head:
        description: Exact 40-hex reviewed supplier source revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: opica-v436-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact unchanged community supplier and no false claim
        run: |
          set -euo pipefail
          python3 verification/opica-v436/qualify.py \
            --output "$RUNNER_TEMP/OPICA_V436_SOURCE_SCOPE.json"
          (cd verification/opica-v436 && python3 -m unittest -v test_qualify)
          (cd verification/opica-v436 && python3 -O -m unittest -v test_qualify)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-v436-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPICA_V436_SOURCE_SCOPE.json
          if-no-files-found: warn
          retention-days: 90
  full-import-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'HMarcusWH/riemann-hypothesis' && inputs.verify_head == github.sha }}
    needs: source
    runs-on: [self-hosted, Linux, X64, opica-longrun]
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight reviewed disposable host and exact source selection
        env:
          REVIEWED_HEAD: ${{ inputs.verify_head }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_HEAD" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "HMarcusWH/riemann-hypothesis"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          case "$RUNNER_NAME" in opica-longrun-*) ;; *) exit 2;; esac
          test -f /etc/opica/community-v436.json
          test "$(stat -c '%u' /etc/opica/community-v436.json)" = 0
          test ! -L /etc/opica/community-v436.json
          python3 - <<'PY'
          import os,json,stat
          from pathlib import Path
          def need(ok,why):
              if not ok: raise SystemExit(why)
          marker=Path("/etc/opica/community-v436.json")
          s=marker.lstat()
          need(stat.S_ISREG(s.st_mode) and s.st_uid==0 and not(stat.S_IMODE(s.st_mode)&0o022) and s.st_size<=4096,"unsafe runner marker")
          j=json.loads(marker.read_text())
          need(j=={"schema":"OPICA_COMMUNITY_436_EPHEMERAL_V1","runner_name":os.environ["RUNNER_NAME"],"ephemeral":True},"wrong runner marker")
          need(len(os.sched_getaffinity(0))>=8,"insufficient CPUs")
          ram=int(next(l.split()[1] for l in Path("/proc/meminfo").read_text().splitlines() if l.startswith("MemTotal:")))//1024
          st=os.statvfs(os.environ["RUNNER_TEMP"])
          need(ram>=120000 and st.f_bavail*st.f_frsize>=250*1024**3 and st.f_favail>=400000,"insufficient runner capacity")
          need(int(Path("/proc/sys/vm/max_map_count").read_text())>=1048576,"insufficient map limit")
          print("RESOURCE_PREFLIGHT_ONLY; RH OPEN")
          PY
          python3 verification/opica-v436/qualify.py \
            --output "$RUNNER_TEMP/OPICA_V436_PREFLIGHT.json"
      - name: Build the pinned independent checker and official runtime
        run: |
          set -euo pipefail
          sudo -n true
          python3 -m venv "$RUNNER_TEMP/opica-v436-venv"
          "$RUNNER_TEMP/opica-v436-venv/bin/python" -m pip install --disable-pip-version-check -r verification/opica-v436/requirements.txt
          "$RUNNER_TEMP/opica-v436-venv/bin/python" verification/opica-v436/bootstrap_checker.py \
            --work "$RUNNER_TEMP/opica-v436-checker" --timeout 7200 --memory-mib 10000 --min-free-gib 6
      - name: Fresh supplier build at the pinned official compiler, no supplier cache reuse
        id: compile
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP/opica-v436-checker/lean-4.36.0-linux/bin"
          export PATH="$rt:$PATH" LEAN_ABORT_ON_PANIC=1 LEAN_NUM_THREADS=2
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.36.0"
          test ! -e .lake/build/lib/lean/Main.olean
          "$rt/lake" exe mathlib/cache get
          if test -d .lake/build/lib/lean; then
            test -z "$(find .lake/build/lib/lean -type f -name '*.olean' -print -quit)"
          fi
          "$rt/lake" --no-cache --wfail build Main 2>&1 | tee "$RUNNER_TEMP/OPICA_V436_BUILD.log"
          "$rt/lake" env lean verification/opica-v436/Ingress.lean \
            -o "$RUNNER_TEMP/OPICA_V436_INGRESS.olean" \
            >"$RUNNER_TEMP/OPICA_V436_LEAN_AXIOMS.log" 2>&1
          cat "$RUNNER_TEMP/OPICA_V436_LEAN_AXIOMS.log"
      - name: Exact external endpoint type and axiom report
        id: receipt
        run: |
          set -euo pipefail
          python3 verification/opica-v436/qualify.py \
            --axiom-log "$RUNNER_TEMP/OPICA_V436_LEAN_AXIOMS.log" \
            --output "$RUNNER_TEMP/OPICA_V436_TYPE_AX_ZERO.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"OPICA_V436_TYPE_AX_ZERO.json").read_text())
          assert d["status"]=="INGRESS_TYPE_COMPILED_PENDING_FULL_CERTIFICATE"
          assert not d["proof_acceptance"]
          assert not d["compiler_axioms"]["full_50_roots"]
          print("EXTERNAL_TYPED_INGRESS_ONLY; INDEPENDENT_PROOF_CHECK_OPEN")
          PY
      - name: Independently verify the complete 38-root supplier dependency closure
        run: |
          set -euo pipefail
          python3 -B verification/opica-v436/independent_38.py \
            --checker-work "$RUNNER_TEMP/opica-v436-checker" \
            --axiom-log "$RUNNER_TEMP/OPICA_V436_LEAN_AXIOMS.log" \
            --head "$GITHUB_SHA" --output "$RUNNER_TEMP/opica-v436-independent"
      - name: Preserve exact full import outcomes even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opica-v436-full-entry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/OPICA_V436_PREFLIGHT.json
            ${{ runner.temp }}/OPICA_V436_LEAN_AXIOMS.log
            ${{ runner.temp }}/OPICA_V436_TYPE_AX_ZERO.json
            ${{ runner.temp }}/OPICA_V436_BUILD.log
            ${{ runner.temp }}/opica-v436-checker/BOOTSTRAP_RECEIPT.json
            ${{ runner.temp }}/opica-v436-independent/RECEIPT.json
            ${{ runner.temp }}/opica-v436-independent/OBJECT_INVENTORY.json
            ${{ runner.temp }}/opica-v436-independent/*.json
            ${{ runner.temp }}/opica-v436-independent/*.log
          if-no-files-found: warn
          retention-days: 90
